spring:
  profiles:
    active: local
  application:
    name: codeinsights

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
        "[hibernate.format_sql]": true

  flyway:
    enabled: true
    baseline-on-migrate: true

api:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 86400000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  web:
    base-url: ${APP_WEB_BASE_URL:http://localhost:5173}
  mail:
    from: ${APP_MAIL_FROM:no-reply@codeinsights.app}
    # Canal de entrega: 'smtp' (MailHog no ambiente local) ou 'smtp2go' (API HTTP).
    # Producao usa smtp2go porque o Render bloqueia as portas SMTP de saida no plano gratuito.
    provider: ${APP_MAIL_PROVIDER:smtp}
    smtp2go:
      url: ${SMTP2GO_URL:https://api.smtp2go.com/v3/email/send}
      # Sem default: so e exigida quando provider=smtp2go, e uma chave em branco falharia
      # silenciosamente com o e-mail marcado como recusado.
      api-key: ${SMTP2GO_API_KEY:}
  # Reprocessa as metricas de TODAS as resolucoes com o motor atual durante o boot. Desligado por
  # padrao: e uma reescrita em massa de dado de pesquisa e deve ser deliberada. O caminho normal e
  # o endpoint administrativo POST /api/admin/metricas/reanalisar; esta flag existe para o caso de
  # nao haver conta admin semeada (ADMIN_PASSWORD ausente).
  reanalisar-na-inicializacao: ${REANALISAR_NA_INICIALIZACAO:false}

admin:
  default:
    email: ${ADMIN_EMAIL:admin@codeinsights.app}
    # Sem default: se ADMIN_PASSWORD nao for definido, o AdminSeeder NAO cria a conta admin
    # (evita uma conta administradora com senha conhecida no repositorio).
    password: ${ADMIN_PASSWORD:}
