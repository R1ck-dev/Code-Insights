spring:
  datasource:
    # A URL precisa carregar ?sslmode=require: o Postgres gerenciado (Neon) recusa conexao
    # sem TLS. Ver docs/deploy.md.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      # O pool precisa ESVAZIAR quando ocioso, e nao so encolher.
      #
      # O Neon suspende o compute do banco apos alguns minutos sem conexao e o plano
      # gratuito da uma cota mensal de horas de computo. No default do Hikari,
      # minimum-idle acompanha maximum-pool-size: o pool mantem conexoes abertas para
      # sempre, o banco nunca fica ocioso, nunca suspende, e a cota do mes evapora em
      # poucos dias de aplicacao no ar sem ninguem usando.
      #
      # Com minimum-idle: 0 o pool fecha tudo depois de idle-timeout, o banco suspende
      # e so acorda quando ha requisicao de verdade. O custo e a primeira consulta apos
      # a ociosidade pagar o wake-up (~1s) alem do handshake TLS.
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 900000
      # Container de 512MB e trafego de piloto nao justificam as 10 conexoes do default.
      maximum-pool-size: 5

  jpa:
    show-sql: false

  # Sem bloco spring.mail em producao de proposito: o envio nao passa por SMTP.
  # O plano gratuito do Render bloqueia a saida nas portas 25, 465 e 587, entao o
  # canal e a API HTTP do SMTP2GO (ver app.mail.provider abaixo).

app:
  cors:
    # Em producao a origem e obrigatoria (sem fallback localhost): o boot falha se ausente.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  web:
    # Base dos links de ativacao de conta e de redefinicao de senha. Obrigatoria em
    # producao: com o fallback localhost:5173 do application.yml, todo e-mail enviado
    # ao aluno levaria a um endereco que so existe na sua maquina — e a falha so
    # apareceria depois, na caixa de entrada dele.
    base-url: ${APP_WEB_BASE_URL}
  mail:
    # A plataforma roda SEM provedor de e-mail. Nao e preferencia: nao ha caminho viavel com os
    # recursos atuais — o Render bloqueia as portas SMTP no plano gratuito, Brevo e Resend exigem
    # dominio proprio verificado para enviar a terceiros, e o SMTP2GO recusa cadastro com e-mail
    # gratuito. Em vez de manter um canal que falha, as contas nascem ativas e a recuperacao de
    # acesso passa pelas rotas administrativas (ver docs/deploy.md).
    #
    # Para religar o e-mail um dia, basta trocar para 'smtp2go' e definir SMTP2GO_API_KEY e
    # APP_MAIL_FROM com um remetente verificado. Nada de codigo muda, nem o front — o registro
    # devolve precisaAtivarPorEmail e a interface se adapta sozinha.
    provider: ${APP_MAIL_PROVIDER:nenhum}
    from: ${APP_MAIL_FROM:no-reply@codeinsights.app}
    smtp2go:
      api-key: ${SMTP2GO_API_KEY:}

server:
  port: ${PORT:8080}
